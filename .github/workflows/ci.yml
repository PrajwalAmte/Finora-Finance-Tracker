name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  # ── 1. Lint, type-check, unit tests, web bundle ─────────────────────────────
  app:
    name: App – Lint, Types, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:pwa

  # ── 2. Android debug APK (proves the native project and SMS plugin compile) ──
  android:
    name: Android – Debug build
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: finora-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ── 3. iOS simulator build (compiles the Swift text-recognition plugin) ─────
  ios:
    name: iOS – Simulator build
    runs-on: macos-15
    needs: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Build for the simulator
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
